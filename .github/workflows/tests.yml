name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  companiond:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companiond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  companiond-macos:
    runs-on: macos-26
    defaults:
      run:
        working-directory: companiond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: test -x /usr/bin/sandbox-exec && echo "sandbox-exec present"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  app:
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install companiond (daemon integration test, bundle staging)
        working-directory: companiond
        run: npm ci
      - name: Point the daemon integration test at this Node
        run: echo "COMPANION_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - run: swift test
      - name: Build and verify the signed bundle (ad-hoc)
        working-directory: .
        run: bash scripts/build-app.sh
