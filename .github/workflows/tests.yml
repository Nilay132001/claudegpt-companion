name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  companiond:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companiond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  companiond-macos:
    runs-on: macos-26
    defaults:
      run:
        working-directory: companiond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: test -x /usr/bin/sandbox-exec && echo "sandbox-exec present"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  app:
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: swift test
