name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  companiond:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companiond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  companiond-macos:
    runs-on: macos-26
    defaults:
      run:
        working-directory: companiond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: test -x /usr/bin/sandbox-exec && echo "sandbox-exec present"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  app:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install companiond (daemon integration test, bundle staging)
        working-directory: companiond
        run: npm ci
      - name: Point the daemon integration test at this Node
        run: echo "COMPANION_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Cache the pinned Node.js tarball
        uses: actions/cache@v4
        with:
          path: app/build/cache
          key: node-${{ hashFiles('app/bundle/node.pin') }}
      - run: swift test
      - name: Build and verify the signed bundle (ad-hoc)
        working-directory: .
        run: bash scripts/build-app.sh
      - name: Smoke the built bundle (signed out, throw-away HOME)
        working-directory: .
        run: bash scripts/smoke-bundle.sh
      - name: Package the DMG
        working-directory: .
        run: bash scripts/package-app.sh
      - name: Packaging script checks (offline)
        working-directory: .
        run: bash scripts/test-packaging.sh
